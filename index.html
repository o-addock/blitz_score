<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blitz! Score Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One:wght@400&family=Baloo+2:wght@400;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #f0f8ff 0%, #e6f3ff 100%);
            color: #111;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        .screen {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 20px 0;
        }

        .screen.active {
            display: block;
        }

        .title {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(2.5rem, 8vw, 4rem);
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 3px 3px 0 #111;
        }

        .subtitle {
            font-family: 'Baloo 2', cursive;
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .round-title {
            font-family: 'Baloo 2', cursive;
            font-size: clamp(2rem, 7vw, 3rem);
            text-align: center;
            margin-bottom: 30px;
            color: #e74c3c;
            font-weight: 700;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        .btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 15px auto;
            padding: 18px 30px;
            font-family: 'Baloo 2', cursive;
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            font-weight: 700;
            border: 4px solid #111;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
        }

        .btn-back {
            background: linear-gradient(45deg, #95a5a6, #7f8c8d);
            color: white;
            max-width: 200px;
        }

        .input-group {
            margin: 25px 0;
        }

        .input-label {
            display: block;
            font-family: 'Baloo 2', cursive;
            font-size: 1.3rem;
            margin-bottom: 12px;
            color: #2c3e50;
            font-weight: 700;
        }

        .input-field {
            width: 100%;
            padding: 20px;
            font-size: 1.3rem;
            border: 4px solid #111;
            border-radius: 20px;
            background: white;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            min-height: 60px;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.2);
        }

        .player-setup {
            background: white;
            border: 4px solid #111;
            border-radius: 24px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        .player-list {
            background: white;
            border: 4px solid #111;
            border-radius: 24px;
            padding: 25px;
            margin: 20px 0;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            margin: 15px 0;
            background: #f8f9fa;
            border: 3px solid #ddd;
            border-radius: 20px;
            font-family: 'Baloo 2', cursive;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .player-name {
            flex: 1;
            color: #2c3e50;
        }

        .score-input {
            flex: 1;
            max-width: 120px;
            padding: 15px;
            border: 3px solid #ddd;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            min-height: 55px;
            margin-left: 20px;
        }

        .score-input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
            font-size: 1.3rem;
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            background: white;
            border: 4px solid #111;
            border-radius: 20px;
            padding: 25px;
            margin: 15px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .history-date {
            font-family: 'Baloo 2', cursive;
            font-size: 1.4rem;
            color: #2c3e50;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border: 6px solid #111;
            border-radius: 30px;
            padding: 40px;
            max-width: 95%;
            max-height: 95%;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .leaderboard {
            list-style: none;
            margin-top: 30px;
        }

        .leaderboard-item {
            padding: 25px;
            margin: 15px 0;
            border: 4px solid #ddd;
            border-radius: 20px;
            font-family: 'Baloo 2', cursive;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            background: white;
        }

        .leaderboard-item.first {
            background: linear-gradient(45deg, #f1c40f, #f39c12) !important;
            border-color: #111 !important;
            font-size: 1.6rem;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(241, 196, 15, 0.4);
        }

        .leaderboard-rank {
            font-size: 2rem;
            font-weight: 900;
            margin-right: 20px;
            width: 60px;
            text-align: center;
        }

        .full-table {
            background: white;
            border: 4px solid #111;
            border-radius: 24px;
            padding: 25px;
            margin: 20px 0;
            overflow-x: auto;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        .game-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Baloo 2', cursive;
            min-width: 500px;
        }

        .game-table th,
        .game-table td {
            border: 3px solid #111;
            padding: 18px 12px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .game-table th {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
        }

        .game-table td.round-header {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            font-size: 1.2rem;
        }

        .total-cell {
            background: linear-gradient(45deg, #f1c40f, #f39c12) !important;
            font-size: 1.4rem !important;
            font-weight: 900 !important;
            color: #111 !important;
        }

        .progress-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .progress-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ddd;
            border: 3px solid #111;
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: #4CAF50;
            transform: scale(1.3);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 350px;
            margin: 30px auto;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .player-item {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }
            
            .score-input {
                max-width: none;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen active">
        <h1 class="title">BLITZ! SCORE</h1>
        <button class="btn btn-primary" onclick="showScreen('setup-config-screen')">NOVO JOGO</button>
        <button class="btn btn-secondary" onclick="showScreen('history-screen')">HISTÓRICO</button>
    </div>

    <!-- SETUP CONFIG SCREEN -->
    <div id="setup-config-screen" class="screen">
        <h2 class="subtitle">Configurações</h2>
        <div class="progress-indicator">
            <div class="progress-dot active"></div>
            <div class="progress-dot"></div>
        </div>
        
        <div class="input-group">
            <label class="input-label">Número de Jogadores</label>
            <select id="players-count" class="input-field">
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
            </select>
        </div>

        <div class="input-group">
            <label class="input-label">Número de Rodadas</label>
            <select id="rounds-count" class="input-field">
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="5">5</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="goToPlayerSetup()">PRÓXIMO</button>
        <button class="btn btn-back" onclick="showHome()">VOLTAR</button>
    </div>

    <!-- SETUP PLAYERS SCREEN -->
    <div id="setup-players-screen" class="screen">
        <h2 class="subtitle" id="player-title">Nome do Jogador 1</h2>
        <div class="progress-indicator" id="player-progress"></div>
        
        <div class="player-setup">
            <div class="input-group">
                <input type="text" id="player-name-input" class="input-field" placeholder="Digite o nome aqui..." maxlength="20">
            </div>
            <button class="btn btn-primary" id="next-player-btn" onclick="nextPlayer()">PRÓXIMO JOGADOR</button>
            <button class="btn btn-back" onclick="goToConfig()">PULAR</button>
        </div>
    </div>

    <!-- GAME SCREEN (Round by Round) -->
    <div id="game-screen" class="screen">
        <h2 class="round-title" id="round-title">Round 1 / 4</h2>
        <div class="player-list" id="player-list">
            <!-- Dynamically generated -->
        </div>
        <button class="btn btn-primary" id="next-round-btn" onclick="nextRound()">PRÓXIMO ROUND</button>
        <button class="btn btn-back" onclick="showHome()">VOLTAR AO INÍCIO</button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="results-screen" class="screen">
        <h1 class="title" style="background: linear-gradient(45deg, #e74c3c, #c0392b); margin-bottom: 20px;">FIM DE JOGO!</h1>
        <h2 class="subtitle">Placar Final</h2>
        <ul class="leaderboard" id="results-leaderboard">
            <!-- Dynamically generated -->
        </ul>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="showFullTableModal()">VER TABELA COMPLETA</button>
            <button class="btn btn-primary" onclick="playAgain()">JOGAR NOVAMENTE</button>
            <button class="btn btn-warning" onclick="newGame()">NOVO JOGO</button>
        </div>
    </div>

    <!-- HISTORY SCREEN -->
    <div id="history-screen" class="screen">
        <h2 class="subtitle">Histórico de Partidas</h2>
        <div id="history-content">
            <!-- Empty state or list -->
        </div>
        <button class="btn btn-back" onclick="showHome()">VOLTAR</button>
    </div>

    <!-- HISTORY MODAL -->
    <div id="history-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="subtitle" id="modal-title">Placar Final</h2>
            <h3 id="modal-date" style="text-align: center; margin-bottom: 20px; color: #2c3e50;"></h3>
            <ul class="leaderboard" id="leaderboard-list">
                <!-- Dynamically generated -->
            </ul>
            <button class="btn btn-primary" onclick="closeModal()" style="margin-top: 30px;">FECHAR</button>
        </div>
    </div>

    <!-- FULL TABLE MODAL -->
    <div id="full-table-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="subtitle">Tabela Completa</h2>
            <div class="full-table" id="full-table-content">
                <!-- Dynamically generated -->
            </div>
            <button class="btn btn-primary" onclick="closeFullTableModal()" style="margin-top: 20px;">FECHAR</button>
        </div>
    </div>

    <script>
        // Game state
        let gameState = {
            players: [],
            rounds: 0,
            currentRound: 1,
            currentPlayerIndex: 0,
            gameScores: {}, // {playerName: [round1Score, round2Score, ...]}
            history: [],
            currentGame: null // For results screen
        };

        // Screen navigation
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function showHome() {
            showScreen('home-screen');
            resetGameState();
        }

        // Setup flow
        function goToPlayerSetup() {
            const playersCount = parseInt(document.getElementById('players-count').value);
            const roundsCount = parseInt(document.getElementById('rounds-count').value);
            
            gameState.players = [];
            gameState.rounds = roundsCount;
            gameState.currentPlayerIndex = 0;
            
            showScreen('setup-players-screen');
            updatePlayerSetup();
        }

        function updatePlayerSetup() {
            const playerNum = gameState.currentPlayerIndex + 1;
            document.getElementById('player-title').textContent = `Nome do Jogador ${playerNum}`;
            
            // Update progress dots
            const progressContainer = document.getElementById('player-progress');
            progressContainer.innerHTML = '';
            const totalPlayers = parseInt(document.getElementById('players-count').value);
            for (let i = 0; i < totalPlayers; i++) {
                const dot = document.createElement('div');
                dot.className = `progress-dot ${i < gameState.currentPlayerIndex ? 'active' : ''}`;
                progressContainer.appendChild(dot);
            }
            
            const input = document.getElementById('player-name-input');
            input.value = '';
            input.focus();
            
            const nextBtn = document.getElementById('next-player-btn');
            if (gameState.currentPlayerIndex === totalPlayers - 1) {
                nextBtn.textContent = 'INICIAR JOGO!';
            } else {
                nextBtn.textContent = 'PRÓXIMO JOGADOR';
            }
        }

        function nextPlayer() {
            const nameInput = document.getElementById('player-name-input').value.trim();
            const playerNum = gameState.currentPlayerIndex + 1;
            const playerName = nameInput || `Jogador ${playerNum}`;
            gameState.players.push(playerName);
            
            gameState.currentPlayerIndex++;
            const totalPlayers = parseInt(document.getElementById('players-count').value);
            
            if (gameState.currentPlayerIndex < totalPlayers) {
                updatePlayerSetup();
            } else {
                startGame();
            }
        }

        function goToConfig() {
            showScreen('setup-config-screen');
        }

        // Game screen (Round by Round)
        function startGame() {
            // Initialize scores for all rounds
            gameState.gameScores = {};
            gameState.players.forEach(player => {
                gameState.gameScores[player] = new Array(gameState.rounds).fill(0);
            });
            gameState.currentRound = 1;
            
            renderCurrentRound();
            showScreen('game-screen');
        }

        function renderCurrentRound() {
            document.getElementById('round-title').textContent = `Round ${gameState.currentRound} / ${gameState.rounds}`;
            
            const playerList = document.getElementById('player-list');
            let html = '';
            
            gameState.players.forEach(player => {
                const score = gameState.gameScores[player][gameState.currentRound - 1];
                html += `
                    <div class="player-item">
                        <div class="player-name">${player}</div>
                        <input type="text" 
                               class="score-input" 
                               data-player="${player}" 
                               data-round="${gameState.currentRound}"
                               value="${score || '0'}"
                               placeholder="0">
                    </div>
                `;
            });
            
            playerList.innerHTML = html;
            
            // Add event listeners to new inputs
            document.querySelectorAll('.score-input').forEach(input => {
                input.addEventListener('input', handleScoreInput);
                input.addEventListener('focus', handleScoreFocus);
                input.addEventListener('blur', handleScoreBlur);
            });
            
            // Update next button
            const nextBtn = document.getElementById('next-round-btn');
            if (gameState.currentRound === gameState.rounds) {
                nextBtn.textContent = 'FINALIZAR PARTIDA';
            } else {
                nextBtn.textContent = 'PRÓXIMO ROUND';
            }
        }

        // Score input handlers
        function handleScoreInput(e) {
            let value = e.target.value;
            // Only allow numbers and one leading minus sign
            value = value.replace(/[^0-9-]/g, '');
            // Only one minus, and only at start
            if (value.split('-').length > 2 || (value.indexOf('-') > 0 && value.lastIndexOf('-') > 0)) {
                value = value.replace(/-/g, '');
            } else if (value.indexOf('-') > 0) {
                value = '-' + value.replace(/-/g, '').slice(1);
            }
            e.target.value = value;
            
            // Update game state
            const player = e.target.dataset.player;
            const round = parseInt(e.target.dataset.round);
            gameState.gameScores[player][round - 1] = parseInt(value) || 0;
        }

        function handleScoreFocus(e) {
            if (e.target.value === '0') {
                e.target.value = '';
            }
        }

        function handleScoreBlur(e) {
            if (!e.target.value.trim()) {
                e.target.value = '0';
                const player = e.target.dataset.player;
                const round = parseInt(e.target.dataset.round);
                gameState.gameScores[player][round - 1] = 0;
            }
        }

        function nextRound() {
            if (gameState.currentRound === gameState.rounds) {
                // Finalize game
                finishGame();
            } else {
                gameState.currentRound++;
                renderCurrentRound();
            }
        }

        function finishGame() {
            // Calculate final results
            const results = gameState.players.map(player => ({
                name: player,
                total: gameState.gameScores[player].reduce((sum, score) => sum + score, 0)
            })).sort((a, b) => b.total - a.total);
            
            gameState.currentGame = {
                date: new Date().toLocaleString('pt-BR'),
                players: [...gameState.players],
                scores: gameState.players.map(player => [...gameState.gameScores[player]]),
                rounds: gameState.rounds,
                results: results
            };
            
            // Save to history
            gameState.history.unshift(gameState.currentGame);
            renderHistory();
            
            // Show results
            renderResults();
            showScreen('results-screen');
        }

        // Results screen
        function renderResults() {
            const leaderboard = document.getElementById('results-leaderboard');
            let html = '';
            
            gameState.currentGame.results.forEach((result, index) => {
                html += `
                    <li class="leaderboard-item ${index === 0 ? 'first' : ''}">
                        <span class="leaderboard-rank">${index + 1}º</span>
                        ${result.name}: <strong>${result.total}</strong>
                    </li>
                `;
            });
            
            leaderboard.innerHTML = html;
        }

        function showFullTableModal() {
            const game = gameState.currentGame;
            const tableContent = document.getElementById('full-table-content');
            
            let html = `
                <table class="game-table">
                    <thead>
                        <tr>
                            <th>RODADA</th>
            `;
            
            game.players.forEach(player => {
                html += `<th>${player}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            for (let round = 1; round <= game.rounds; round++) {
                html += `<tr>
                    <td class="round-header">R${round}</td>`;
                
                game.players.forEach((player, playerIndex) => {
                    html += `<td>${game.scores[playerIndex][round - 1]}</td>`;
                });
                html += '</tr>';
            }
            
            html += '<tr>';
            html += '<td class="round-header" style="background: linear-gradient(45deg, #e74c3c, #c0392b) !important;">TOTAL</td>';
            game.players.forEach((player, playerIndex) => {
                const total = game.scores[playerIndex].reduce((sum, score) => sum + score, 0);
                html += `<td class="total-cell">${total}</td>`;
            });
            html += '</tr></tbody></table>';
            
            tableContent.innerHTML = html;
            document.getElementById('full-table-modal').classList.add('active');
        }

        function closeFullTableModal() {
            document.getElementById('full-table-modal').classList.remove('active');
        }

        function playAgain() {
            // Reset scores but keep players and rounds
            gameState.gameScores = {};
            gameState.players.forEach(player => {
                gameState.gameScores[player] = new Array(gameState.rounds).fill(0);
            });
            gameState.currentRound = 1;
            renderCurrentRound();
            showScreen('game-screen');
        }

        function newGame() {
            resetGameState();
            showScreen('setup-config-screen');
        }

        // History
        function renderHistory() {
            const container = document.getElementById('history-content');
            
            if (gameState.history.length === 0) {
                container.innerHTML = '<div class="empty-state">Nenhum histórico disponível 😔</div>';
                return;
            }
            
            let html = '<ul class="history-list">';
            gameState.history.forEach(game => {
                html += `
                    <li class="history-item" onclick="showHistoryModal(${game.id || JSON.stringify(game)})">
                        <div>
                            <div class="history-date">${game.date}</div>
                            <div>${game.players.length} jogadores • ${game.rounds} rodadas</div>
                        </div>
                    </li>
                `;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        function showHistoryModal(gameData) {
            // Handle both ID and direct object (for simplicity)
            const game = typeof gameData === 'object' ? gameData : gameState.history.find(g => g.id === gameData);
            if (!game) return;
            
            document.getElementById('modal-title').textContent = 'Placar Final';
            document.getElementById('modal-date').textContent = game.date;
            
            const totals = game.players.map((player, index) => ({
                player,
                total: game.scores[index].reduce((sum, score) => sum + score, 0)
            })).sort((a, b) => b.total - a.total);
            
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            
            totals.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = `leaderboard-item ${index === 0 ? 'first' : ''}`;
                li.innerHTML = `
                    <span class="leaderboard-rank">${index + 1}º</span>
                    ${item.player}: <strong>${item.total}</strong>
                `;
                list.appendChild(li);
            });
            
            document.getElementById('history-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('history-modal').classList.remove('active');
        }

        function resetGameState() {
            gameState.currentPlayerIndex = 0;
            gameState.players = [];
            gameState.gameScores = {};
            gameState.currentRound = 1;
            gameState.currentGame = null;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            renderHistory();
        });

        // Modal close handlers
        document.getElementById('history-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('full-table-modal').addEventListener('click', function(e) {
            if (e.target === this) closeFullTableModal();
        });

        // Keyboard support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeFullTableModal();
            }
        });
    </script>
</body>
</html>
