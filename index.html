<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blitz! Score Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One:wght@400&family=Baloo+2:wght@400;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #f0f8ff 0%, #e6f3ff 100%);
            color: #111;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        .screen {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 20px 0;
        }

        .screen.active {
            display: block;
        }

        .title {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(2.5rem, 8vw, 4rem);
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 3px 3px 0 #111;
        }

        .subtitle {
            font-family: 'Baloo 2', cursive;
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 15px auto;
            padding: 18px 30px;
            font-family: 'Baloo 2', cursive;
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            font-weight: 700;
            border: 4px solid #111;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
        }

        .btn-back {
            background: linear-gradient(45deg, #95a5a6, #7f8c8d);
            color: white;
            max-width: 200px;
        }

        .input-group {
            margin: 25px 0;
        }

        .input-label {
            display: block;
            font-family: 'Baloo 2', cursive;
            font-size: 1.3rem;
            margin-bottom: 12px;
            color: #2c3e50;
            font-weight: 700;
        }

        .input-field {
            width: 100%;
            padding: 20px;
            font-size: 1.3rem;
            border: 4px solid #111;
            border-radius: 20px;
            background: white;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            min-height: 60px;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.2);
        }

        .player-setup {
            background: white;
            border: 4px solid #111;
            border-radius: 24px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        .game-grid {
            background: white;
            border: 4px solid #111;
            border-radius: 24px;
            padding: 25px;
            margin: 20px 0;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            overflow-x: auto;
        }

        .game-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Baloo 2', cursive;
        }

        .game-table th,
        .game-table td {
            border: 3px solid #111;
            padding: 18px 12px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            min-width: 80px;
        }

        .game-table th {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
        }

        .game-table td.round-header {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            font-size: 1.2rem;
        }

        .score-input {
            width: 100%;
            padding: 12px;
            border: 3px solid #ddd;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            min-height: 50px;
        }

        .score-input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }

        .total-cell {
            background: linear-gradient(45deg, #f1c40f, #f39c12) !important;
            font-size: 1.3rem !important;
            font-weight: 900 !important;
            color: #111 !important;
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            background: white;
            border: 4px solid #111;
            border-radius: 20px;
            padding: 25px;
            margin: 15px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .history-date {
            font-family: 'Baloo 2', cursive;
            font-size: 1.4rem;
            color: #2c3e50;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border: 6px solid #111;
            border-radius: 30px;
            padding: 40px;
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .leaderboard {
            list-style: none;
            margin-top: 30px;
        }

        .leaderboard-item {
            padding: 20px;
            margin: 12px 0;
            border: 3px solid #ddd;
            border-radius: 18px;
            font-family: 'Baloo 2', cursive;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
        }

        .leaderboard-item.first {
            background: linear-gradient(45deg, #f1c40f, #f39c12);
            border-color: #111;
            font-size: 1.5rem;
            transform: scale(1.05);
        }

        .leaderboard-rank {
            font-size: 1.8rem;
            font-weight: 900;
            margin-right: 15px;
            width: 50px;
        }

        .progress-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .progress-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ddd;
            border: 3px solid #111;
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: #4CAF50;
            transform: scale(1.3);
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .game-table th,
            .game-table td {
                padding: 12px 8px;
                font-size: 1rem;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen active">
        <h1 class="title">BLITZ! SCORE v1</h1>
        <button class="btn btn-primary" onclick="showScreen('setup-config-screen')">NOVO JOGO</button>
        <button class="btn btn-secondary" onclick="showScreen('history-screen')">HISTÓRICO</button>
    </div>

    <!-- SETUP CONFIG SCREEN -->
    <div id="setup-config-screen" class="screen">
        <h2 class="subtitle">Configurações</h2>
        <div class="progress-indicator">
            <div class="progress-dot active"></div>
            <div class="progress-dot"></div>
        </div>
        
        <div class="input-group">
            <label class="input-label">Número de Jogadores</label>
            <select id="players-count" class="input-field">
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
            </select>
        </div>

        <div class="input-group">
            <label class="input-label">Número de Rodadas</label>
            <select id="rounds-count" class="input-field">
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="5">5</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="goToPlayerSetup()">PRÓXIMO</button>
        <button class="btn btn-back" onclick="showHome()">VOLTAR</button>
    </div>

    <!-- SETUP PLAYERS SCREEN -->
    <div id="setup-players-screen" class="screen">
        <h2 class="subtitle" id="player-title">Nome do Jogador 1</h2>
        <div class="progress-indicator" id="player-progress"></div>
        
        <div class="player-setup">
            <div class="input-group">
                <input type="text" id="player-name-input" class="input-field" placeholder="Digite o nome aqui..." maxlength="20">
            </div>
            <button class="btn btn-primary" id="next-player-btn" onclick="nextPlayer()">PRÓXIMO JOGADOR</button>
            <button class="btn btn-secondary" onclick="generateRandomName()">NOME ALEATÓRIO</button>
            <button class="btn btn-back" onclick="goToConfig()">VOLTAR</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <h2 class="subtitle">Placar da Partida</h2>
        <div class="game-grid">
            <table class="game-table" id="game-table">
                <!-- Dynamically generated -->
            </table>
        </div>
        <button class="btn btn-primary" onclick="finishGame()">FINALIZAR PARTIDA</button>
        <button class="btn btn-back" onclick="showHome()">VOLTAR AO INÍCIO</button>
    </div>

    <!-- HISTORY SCREEN -->
    <div id="history-screen" class="screen">
        <h2 class="subtitle">Histórico de Partidas</h2>
        <ul class="history-list" id="history-list">
            <!-- Dynamically generated -->
        </ul>
        <button class="btn btn-back" onclick="showHome()">VOLTAR</button>
    </div>

    <!-- HISTORY MODAL -->
    <div id="history-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="subtitle" id="modal-title">Placar Final</h2>
            <h3 id="modal-date" style="text-align: center; margin-bottom: 20px; color: #2c3e50;"></h3>
            <ul class="leaderboard" id="leaderboard-list">
                <!-- Dynamically generated -->
            </ul>
            <button class="btn btn-primary" onclick="closeModal()" style="margin-top: 30px;">FECHAR</button>
        </div>
    </div>

    <script>
        // Game state
        let gameState = {
            players: [],
            rounds: 0,
            currentPlayerIndex: 0,
            gameScores: {},
            history: [
                {
                    id: 1,
                    date: '2024-01-15 20:30',
                    players: ['João', 'Maria', 'Pedro', 'Ana'],
                    scores: [[200, 150, 300, 650], [180, 200, 250, 630], [220, 100, 350, 670], [160, 300, 200, 660]],
                    rounds: 4
                },
                {
                    id: 2,
                    date: '2024-01-14 19:45',
                    players: ['Carlos', 'Luiza', 'Marcos'],
                    scores: [[300, 400, 250], [350, 380, 280], [320, 360, 270]],
                    rounds: 3
                }
            ]
        };

        const funnyNames = [
            'Banana Man', 'Cookie Monster', 'Pizza Ninja', 'Taco Bell', 'Donut King',
            'Waffle Warrior', 'Pancake Pal', 'Burger Boss', 'Sushi Samurai',
            'Hotdog Hero', 'Fries Friend', 'Milkshake Master', 'Ice Cream Idol'
        ];

        // Screen navigation
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function showHome() {
            showScreen('home-screen');
            resetGameState();
        }

        // Setup flow
        function goToPlayerSetup() {
            const playersCount = parseInt(document.getElementById('players-count').value);
            const roundsCount = parseInt(document.getElementById('rounds-count').value);
            
            gameState.players = [];
            gameState.rounds = roundsCount;
            gameState.currentPlayerIndex = 0;
            
            showScreen('setup-players-screen');
            updatePlayerSetup();
        }

        function updatePlayerSetup() {
            const playerNum = gameState.currentPlayerIndex + 1;
            document.getElementById('player-title').textContent = `Nome do Jogador ${playerNum}`;
            
            // Update progress dots
            const progressContainer = document.getElementById('player-progress');
            progressContainer.innerHTML = '';
            for (let i = 0; i < gameState.rounds; i++) {
                const dot = document.createElement('div');
                dot.className = `progress-dot ${i <= gameState.currentPlayerIndex ? 'active' : ''}`;
                progressContainer.appendChild(dot);
            }
            
            const input = document.getElementById('player-name-input');
            input.value = '';
            input.focus();
            
            const nextBtn = document.getElementById('next-player-btn');
            if (gameState.currentPlayerIndex === parseInt(document.getElementById('players-count').value) - 1) {
                nextBtn.textContent = 'INICIAR JOGO!';
            } else {
                nextBtn.textContent = 'PRÓXIMO JOGADOR';
            }
        }

        function nextPlayer() {
            const name = document.getElementById('player-name-input').value.trim() || `Jogador ${gameState.currentPlayerIndex + 1}`;
            gameState.players.push(name);
            
            gameState.currentPlayerIndex++;
            const totalPlayers = parseInt(document.getElementById('players-count').value);
            
            if (gameState.currentPlayerIndex < totalPlayers) {
                updatePlayerSetup();
            } else {
                startGame();
            }
        }

        function generateRandomName() {
            const randomName = funnyNames[Math.floor(Math.random() * funnyNames.length)];
            document.getElementById('player-name-input').value = randomName;
        }

        function goToConfig() {
            showScreen('setup-config-screen');
        }

        // Game screen
        function startGame() {
            // Initialize scores
            gameState.gameScores = {};
            gameState.players.forEach(player => {
                gameState.gameScores[player] = new Array(gameState.rounds).fill(0);
            });
            
            renderGameTable();
            showScreen('game-screen');
        }

        function renderGameTable() {
            const table = document.getElementById('game-table');
            let html = `
                <thead>
                    <tr>
                        <th>RODADA</th>
            `;
            
            // Player headers
            gameState.players.forEach(player => {
                html += `<th>${player}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            // Round rows
            for (let round = 1; round <= gameState.rounds; round++) {
                html += `<tr>
                    <td class="round-header">R${round}</td>`;
                
                gameState.players.forEach(player => {
                    html += `
                        <td>
                            <input type="text" class="score-input" 
                                   data-player="${player}" 
                                   data-round="${round}"
                                   value="0"
inputmode="text"
pattern="[-]?[0-9]*"
                                   onchange="updateTotal('${player}')">
                        </td>`;
                });
                html += '</tr>';
            }
            
            // Total row
            html += '<tr>';
            html += '<td class="round-header" style="background: linear-gradient(45deg, #e74c3c, #c0392b) !important;">TOTAL</td>';
            gameState.players.forEach(player => {
                html += `<td class="total-cell" id="total-${player}">0</td>`;
            });
            html += '</tr></tbody>';
            
            table.innerHTML = html;
        }

        function updateTotal(player) {
            let total = 0;
            for (let round = 1; round <= gameState.rounds; round++) {
                const input = document.querySelector(`[data-player="${player}"][data-round="${round}"]`);
                if (input) {
                    total += parseInt(input.value) || 0;
                }
            }
            document.getElementById(`total-${player}`).textContent = total;
        }

        function finishGame() {
            // Save scores to history
            const scores = gameState.players.map(player => {
                const roundScores = [];
                for (let round = 1; round <= gameState.rounds; round++) {
                    const input = document.querySelector(`[data-player="${player}"][data-round="${round}"]`);
                    roundScores.push(parseInt(input.value) || 0);
                }
                return roundScores;
            });
            
            const gameData = {
                id: Date.now(),
                date: new Date().toLocaleString('pt-BR'),
                players: [...gameState.players],
                scores: scores,
                rounds: gameState.rounds
            };
            
            gameState.history.unshift(gameData);
            renderHistory();
            showHome();
        }

        // History
        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            
            gameState.history.forEach(game => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.onclick = () => showHistoryModal(game);
                li.innerHTML = `
                    <div>
                        <div class="history-date">${game.date}</div>
                        <div>${game.players.length} jogadores • ${game.rounds} rodadas</div>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function showHistoryModal(game) {
            document.getElementById('modal-title').textContent = 'Placar Final';
            document.getElementById('modal-date').textContent = game.date;
            
            // Calculate totals and sort
            const totals = game.players.map((player, index) => {
                return {
                    player,
                    total: game.scores[index].reduce((sum, score) => sum + score, 0)
                };
            }).sort((a, b) => b.total - a.total);
            
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            
            totals.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = `leaderboard-item ${index === 0 ? 'first' : ''}`;
                li.innerHTML = `
                    <span class="leaderboard-rank">${index + 1}º</span>
                    ${item.player}: <strong>${item.total}</strong>
                `;
                list.appendChild(li);
            });
            
            document.getElementById('history-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('history-modal').classList.remove('active');
        }

        function resetGameState() {
            gameState.currentPlayerIndex = 0;
            gameState.players = [];
            gameState.gameScores = {};
        }

        // Initialize history on load
        document.addEventListener('DOMContentLoaded', function() {
            renderHistory();
        });

        // Close modal on outside click
        document.getElementById('history-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
